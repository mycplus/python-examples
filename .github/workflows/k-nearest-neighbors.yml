name: k-nearest-neighbors

on:
  push:
    paths: ['machine-learning/k-nearest-neighbors/**', '.github/workflows/k-nearest-neighbors.yml']
  pull_request:
    paths: ['machine-learning/k-nearest-neighbors/**', '.github/workflows/k-nearest-neighbors.yml']

defaults:
  run:
    working-directory: machine-learning/k-nearest-neighbors
    shell: bash

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: machine-learning/k-nearest-neighbors/requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Lint and type-check
        run: |
          ruff check .
          ruff format --check .
          mypy knn.py data.py worked_example.py wine_knn.py wine_experiment.py \
              dimensionality_experiment.py benchmark.py mutations.py tests/test_knn.py pitfalls/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Programs print the article's output
        run: |
          for script in worked_example wine_knn wine_experiment; do
            python "$script.py" | diff --strip-trailing-cr - "tests/expected/$script.txt"
          done
      - name: Experiments run
        run: |
          python dimensionality_experiment.py
          python pitfalls/optimistic_evaluation.py
      - name: Deliberate mistakes are caught
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.15'
        run: python mutations.py
