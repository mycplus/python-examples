name: towers-of-hanoi

on:
  push:
    paths: ['recursion/towers-of-hanoi/**', '.github/workflows/towers-of-hanoi.yml']
  pull_request:
    paths: ['recursion/towers-of-hanoi/**', '.github/workflows/towers-of-hanoi.yml']

defaults:
  run:
    working-directory: recursion/towers-of-hanoi

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lint and type-check
        shell: bash
        run: |
          # Pinned: new ruff releases can enable new default rules.
          python -m pip install --quiet "ruff==0.16.9" "mypy==2.3.1"
          ruff check .
          mypy --strict hanoi.py towers_of_hanoi.py tests/test_hanoi.py pitfalls/base_case_one.py
      - name: Unit tests
        shell: bash
        run: python -m unittest discover -s tests -v
      - name: Listing prints the article's output
        shell: bash
        run: python towers_of_hanoi.py | diff --strip-trailing-cr - tests/expected/towers_of_hanoi.txt
      - name: Pitfall stops at the recursion limit
        shell: bash
        run: |
          if python pitfalls/base_case_one.py 0 > bco.txt 2>&1; then echo "no RecursionError"; exit 1; fi
          grep -q "RecursionError: maximum recursion depth exceeded" bco.txt
