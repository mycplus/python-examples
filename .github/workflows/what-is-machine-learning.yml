name: what-is-machine-learning

on:
  push:
    paths: ['machine-learning/what-is-machine-learning/**', '.github/workflows/what-is-machine-learning.yml']
  pull_request:
    paths: ['machine-learning/what-is-machine-learning/**', '.github/workflows/what-is-machine-learning.yml']

defaults:
  run:
    working-directory: machine-learning/what-is-machine-learning
    shell: bash

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: machine-learning/what-is-machine-learning/requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Programs print the article's output
        run: |
          for script in first_model paradigms learning_curve; do
            python "$script.py" | diff --strip-trailing-cr - "tests/expected/$script.txt"
          done
