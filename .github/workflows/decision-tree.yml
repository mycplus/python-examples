name: decision-tree

on:
  push:
    paths: ['machine-learning/decision-tree/**', '.github/workflows/decision-tree.yml']
  pull_request:
    paths: ['machine-learning/decision-tree/**', '.github/workflows/decision-tree.yml']

defaults:
  run:
    working-directory: machine-learning/decision-tree
    shell: bash

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: machine-learning/decision-tree/requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Lint and type-check
        run: |
          ruff check .
          ruff format --check .
          mypy tree.py data.py export.py export_model.py predict_exported.py worked_example.py \
              breast_cancer_experiment.py stability_experiment.py benchmark.py mutations.py tests/test_tree.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Programs print the article's output
        run: |
          for script in worked_example predict_exported breast_cancer_experiment; do
            python "$script.py" | diff --strip-trailing-cr - "tests/expected/$script.txt"
          done
      - name: Experiments run
        run: python stability_experiment.py
      - name: Deliberate mistakes are caught
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.15'
        run: python mutations.py
